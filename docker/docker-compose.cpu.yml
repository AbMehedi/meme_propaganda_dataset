# ============================================================================
# CPU-Only Override — for teammates WITHOUT an NVIDIA GPU
# ============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
#
# This removes GPU reservations from both services.
# EasyOCR will automatically fall back to CPU (slower: ~3-8s per image).
# Ollama will run on CPU as well (slower inference, but functional).
# ============================================================================

services:
  app:
    deploy:
      resources:
        reservations:
          devices: []

  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices: []
