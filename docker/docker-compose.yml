# ============================================================================
# Bangla Meme Propaganda Dataset — Docker Compose
# ============================================================================
# Usage (from project root):
#   docker compose -f docker/docker-compose.yml up -d --build        # start both services
#   docker compose -f docker/docker-compose.yml exec app python ocr_and_store.py
#   docker compose -f docker/docker-compose.yml exec ollama ollama pull qwen2.5:3b
#   docker compose -f docker/docker-compose.yml down                 # stop everything
#
# CPU-only (no NVIDIA GPU):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.cpu.yml up -d --build
name: meme_propaganda_dataset

services:
  # ── Python Pipeline Container ──────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: meme-pipeline
    volumes:
      - ..:/app                              # live code mount (edit on host, run in container)
      - easyocr_models:/root/.EasyOCR       # persist EasyOCR model downloads
    ports:
      - "5000:5000"                         # Human Annotation UI (http://localhost:5000)
    env_file:
      - ../.env
    environment:
      - OLLAMA_HOST=http://ollama:11434     # container-to-container networking
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - ollama
    stdin_open: true
    tty: true

  # ── Ollama LLM Server ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: meme-ollama
    volumes:
      - ollama_models:/root/.ollama         # persist pulled LLM models
    ports:
      - "11434:11434"                       # expose Ollama API to host too
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  easyocr_models:
    name: meme_easyocr_models
  ollama_models:
    name: meme_ollama_models
