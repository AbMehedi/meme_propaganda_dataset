# ============================================================================
# Bangla Meme Propaganda Dataset — Docker Compose
# ============================================================================
# Usage (from project root):
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml exec app python download_and_hash.py
#   docker compose -f docker/docker-compose.yml exec app python ocr_and_store.py
#   docker compose -f docker/docker-compose.yml exec app python reconstruct_text.py
#   docker compose -f docker/docker-compose.yml exec app python verify_ocr.py
#   docker compose -f docker/docker-compose.yml down
# ============================================================================
name: meme_propaganda_dataset

services:
  # ── Python Pipeline Container ──────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: meme-pipeline
    volumes:
      - ..:/app                              # live code mount (edit on host, run in container)
      - easyocr_models:/root/.EasyOCR       # persist EasyOCR model downloads
    env_file:
      - ../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

volumes:
  easyocr_models:
    name: meme_easyocr_models
